<!-- 로그인 창 (login.js가 불러와서 index.html의 body 끝에 동적으로 삽입함) -->
<div
  class="login-overlay"
  id="loginOverlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="loginTitle"
>
  <div class="login-modal" id="loginModal">
    <button type="button" class="login-close" id="loginClose" aria-label="닫기">✕</button>
    <h3 id="loginTitle">로그인</h3>
    <p class="login-desc">DỘNGYỘS 계정으로 로그인하세요.</p>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <label for="loginEmail">이메일</label>
        <input type="email" id="loginEmail" placeholder="hello@dongyos.com" autocomplete="email" />
      </div>
      <div class="login-field">
        <label for="loginPw">비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password" />
      </div>
      <div class="login-options">
        <label><input type="checkbox" id="loginRemember" /> 로그인 상태 유지</label>
        <a href="#">비밀번호 찾기</a>
      </div>
      <p class="login-error" id="loginError" role="alert"></p>
      <button type="submit" class="login-submit">로그인</button>
    </form>

    <p class="login-footer">계정이 없으신가요? <a href="#">회원가입</a></p>

    <div class="login-success">
      <div class="check">✓</div>
      <h4 id="loginWelcome" style="margin: 10px 0 4px">로그인되었습니다</h4>
      <p style="color: #86868b; font-size: 14px; margin: 0">창이 곧 닫힙니다.</p>
    </div>
  </div>
</div>
